<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Dashboard - Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center">
                        <i data-lucide="bar-chart-3" class="w-6 h-6 text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Medical Analytics Dashboard</h1>
                        <p class="text-sm text-gray-500">Real-time Medical Data Insights</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-sm text-gray-600">Live Data</span>
                    </div>
                    <a href="index.html" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
                        <i data-lucide="message-circle" class="w-4 h-4 inline mr-2"></i>
                        Chat Bot
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Total Patients</p>
                        <p class="text-3xl font-bold text-blue-600" id="totalPatients">-</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="users" class="w-6 h-6 text-blue-600"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Active Alerts</p>
                        <p class="text-3xl font-bold text-red-600" id="activeAlerts">-</p>
                    </div>
                    <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="alert-triangle" class="w-6 h-6 text-red-600"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Pending Tasks</p>
                        <p class="text-3xl font-bold text-orange-600" id="pendingTasks">-</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="clock" class="w-6 h-6 text-orange-600"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600">Lab Results</p>
                        <p class="text-3xl font-bold text-green-600" id="labResults">-</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="activity" class="w-6 h-6 text-green-600"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row 1 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Patient Demographics -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Patient Demographics</h3>
                <div class="chart-container">
                    <canvas id="demographicsChart"></canvas>
                </div>
            </div>

            <!-- Medical Conditions Distribution -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Medical Conditions</h3>
                <div class="chart-container">
                    <canvas id="conditionsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Charts Row 2 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Vital Signs Trends -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Vital Signs Trends</h3>
                <div class="chart-container">
                    <canvas id="vitalsChart"></canvas>
                </div>
            </div>

            <!-- Lab Results Analysis -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Lab Results Analysis</h3>
                <div class="chart-container">
                    <canvas id="labsChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Charts Row 3 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Alert Severity -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Alert Severity Distribution</h3>
                <div class="chart-container">
                    <canvas id="alertsChart"></canvas>
                </div>
            </div>

            <!-- Medication Usage -->
            <div class="bg-white rounded-2xl p-6 shadow-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Top Medications</h3>
                <div class="chart-container">
                    <canvas id="medicationsChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Global variables
        let dashboardData = {};

        // Load dashboard data
        async function loadDashboardData() {
            try {
                // Load all data in parallel
                const [patients, alerts, tasks, labs] = await Promise.all([
                    fetch('/api/patients').then(r => r.json()),
                    fetch('/api/alerts').then(r => r.json()),
                    fetch('/api/tasks').then(r => r.json()),
                    fetch('/api/labs').then(r => r.json())
                ]);

                dashboardData = { patients, alerts, tasks, labs };
                updateStats();
                createCharts();
            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }

        // Update stats
        function updateStats() {
            const { patients, alerts, tasks, labs } = dashboardData;
            
            document.getElementById('totalPatients').textContent = patients.length;
            document.getElementById('activeAlerts').textContent = alerts.filter(a => !a.resolved_at).length;
            document.getElementById('pendingTasks').textContent = tasks.filter(t => t.status === 'pending').length;
            document.getElementById('labResults').textContent = labs.length;
        }

        // Create charts
        function createCharts() {
            createDemographicsChart();
            createConditionsChart();
            createVitalsChart();
            createLabsChart();
            createAlertsChart();
            createMedicationsChart();
        }

        // Demographics Chart
        function createDemographicsChart() {
            const ctx = document.getElementById('demographicsChart').getContext('2d');
            const { patients } = dashboardData;
            
            const genderCounts = patients.reduce((acc, patient) => {
                acc[patient.sex] = (acc[patient.sex] || 0) + 1;
                return acc;
            }, {});

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(genderCounts),
                    datasets: [{
                        data: Object.values(genderCounts),
                        backgroundColor: ['#3B82F6', '#EC4899'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Conditions Chart
        function createConditionsChart() {
            const ctx = document.getElementById('conditionsChart').getContext('2d');
            const { patients } = dashboardData;
            
            const conditions = patients.map(p => p.primary_dx).filter(Boolean);
            const conditionCounts = conditions.reduce((acc, condition) => {
                acc[condition] = (acc[condition] || 0) + 1;
                return acc;
            }, {});

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(conditionCounts),
                    datasets: [{
                        label: 'Patients',
                        data: Object.values(conditionCounts),
                        backgroundColor: '#10B981',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Vitals Chart
        function createVitalsChart() {
            const ctx = document.getElementById('vitalsChart').getContext('2d');
            
            // Sample vitals data for demonstration
            const vitalsData = {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [
                    {
                        label: 'Heart Rate (avg)',
                        data: [72, 75, 78, 76, 74, 73, 75],
                        borderColor: '#EF4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        tension: 0.4
                    },
                    {
                        label: 'Blood Pressure (avg)',
                        data: [120, 125, 130, 128, 122, 118, 124],
                        borderColor: '#3B82F6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.4
                    }
                ]
            };

            new Chart(ctx, {
                type: 'line',
                data: vitalsData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Labs Chart
        function createLabsChart() {
            const ctx = document.getElementById('labsChart').getContext('2d');
            const { labs } = dashboardData;
            
            const abnormalLabs = labs.filter(lab => lab.abnormal_flag === 'H' || lab.abnormal_flag === 'L').length;
            const normalLabs = labs.length - abnormalLabs;

            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Normal', 'Abnormal'],
                    datasets: [{
                        data: [normalLabs, abnormalLabs],
                        backgroundColor: ['#10B981', '#EF4444'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Alerts Chart
        function createAlertsChart() {
            const ctx = document.getElementById('alertsChart').getContext('2d');
            const { alerts } = dashboardData;
            
            const severityCounts = alerts.reduce((acc, alert) => {
                acc[alert.severity] = (acc[alert.severity] || 0) + 1;
                return acc;
            }, {});

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(severityCounts),
                    datasets: [{
                        label: 'Alerts',
                        data: Object.values(severityCounts),
                        backgroundColor: ['#10B981', '#F59E0B', '#EF4444', '#DC2626'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Medications Chart
        function createMedicationsChart() {
            const ctx = document.getElementById('medicationsChart').getContext('2d');
            
            // Sample medication data
            const medications = [
                { name: 'Metformin', count: 1 },
                { name: 'Lisinopril', count: 1 },
                { name: 'Albuterol', count: 1 },
                { name: 'Atorvastatin', count: 1 },
                { name: 'Aspirin', count: 1 }
            ];

            new Chart(ctx, {
                type: 'horizontalBar',
                data: {
                    labels: medications.map(m => m.name),
                    datasets: [{
                        label: 'Patients',
                        data: medications.map(m => m.count),
                        backgroundColor: '#8B5CF6',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    scales: {
                        x: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', loadDashboardData);
    </script>
</body>
</html>
